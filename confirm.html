<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>タスク確認 — KIYORA 業務管理</title>
<style>
  :root{ --navy:#1F3864; --line:#d9dee7; --muted:#6b7280; --ink:#1a1a1a; --bg:#f4f6fa; --ok:#1D9E75; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;padding:28px 26px;box-shadow:0 4px 20px rgba(31,56,100,.08)}
  .brand{font-size:12px;color:var(--navy);font-weight:700;letter-spacing:.08em;margin-bottom:18px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .row{display:flex;padding:8px 0;border-top:1px solid #eef1f6;font-size:14px}
  .row .l{color:var(--muted);width:84px;flex-shrink:0}
  .row .v{font-weight:600}
  .btn{width:100%;height:46px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:16px;font-size:14px;text-align:center}
  .ok{color:var(--ok);font-weight:600}
  .err{color:#A32D2D}
  .done-ic{font-size:40px;text-align:center;color:var(--ok);margin-bottom:8px}
  .hide{display:none}
  .foot{margin-top:20px;text-align:center;font-size:11px;color:#aab1bd}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">KIYORA 業務管理</div>

    <div id="loading" class="sub">読み込み中…</div>

    <div id="content" class="hide">
      <h1 id="title">タスクの確認</h1>
      <div class="sub" id="forWho"></div>
      <div class="row"><span class="l">タスク</span><span class="v" id="taskName">—</span></div>
      <div class="row" id="dueRow"><span class="l">期限</span><span class="v" id="due">—</span></div>
      <button class="btn" id="confirmBtn">内容を確認しました</button>
      <div class="msg" id="msg"></div>
    </div>

    <div id="errorBox" class="hide">
      <h1>確認できませんでした</h1>
      <div class="sub" id="errMsg">リンクが無効か、期限切れの可能性があります。</div>
    </div>

    <div class="foot">臨床から宇宙へ。KIYORAは医療の未来を創る。</div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const task = qs.get("task"), who = qs.get("who"), sig = qs.get("sig");

  function showError(m){ $("loading").classList.add("hide"); $("content").classList.add("hide"); $("errorBox").classList.remove("hide"); if(m) $("errMsg").textContent = m; }

  async function init(){
    if(!task || !who || !sig){ showError("リンクのパラメータが不足しています。"); return; }
    try{
      const r = await fetch(`/api/confirm-info?task=${encodeURIComponent(task)}&who=${encodeURIComponent(who)}&sig=${encodeURIComponent(sig)}`);
      const d = await r.json();
      if(!d.ok){ showError(d.error || "リンクが無効です。"); return; }
      $("loading").classList.add("hide");
      $("content").classList.remove("hide");
      $("forWho").textContent = `${d.who} さんへの確認依頼`;
      $("taskName").textContent = d.taskName;
      if(d.due){ $("due").textContent = String(d.due).slice(0,10); } else { $("dueRow").classList.add("hide"); }
      if(d.already){
        $("confirmBtn").disabled = true;
        $("confirmBtn").textContent = "確認済み";
        $("msg").innerHTML = '<span class="ok">この内容はすでに確認済みです。</span>';
      }
    }catch(e){ showError("通信エラーが発生しました。"); }
  }

  $("confirmBtn").addEventListener("click", async ()=>{
    const btn = $("confirmBtn"); btn.disabled = true; btn.textContent = "記録中…";
    try{
      const r = await fetch("/api/confirm", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ task, who, sig })
      });
      const d = await r.json();
      if(d.ok){
        btn.textContent = "確認しました";
        $("msg").innerHTML = '<div class="done-ic">✓</div><span class="ok">確認を記録しました。ありがとうございます。</span>';
      }else{
        btn.disabled = false; btn.textContent = "内容を確認しました";
        $("msg").innerHTML = `<span class="err">${d.error || "記録に失敗しました"}</span>`;
      }
    }catch(e){
      btn.disabled = false; btn.textContent = "内容を確認しました";
      $("msg").innerHTML = '<span class="err">通信エラーが発生しました。</span>';
    }
  });

  init();
</script>
</body>
</html>
